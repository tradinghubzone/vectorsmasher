<!DOCTYPE html>

<style>

.tick{height:160px;background:#0a0e1a;border:1px solid #222;border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:end;padding:5px}

<body>
<div class="top">

</div>

<div class="grid">
<div>
<div class="card">
<h3>📈 Manual Trading</h3>
<select id="market" class="input">

<script>
const APP_ID='34LmtjEQdOd9cQs0Zh1uc';
let ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id='+APP_ID);
