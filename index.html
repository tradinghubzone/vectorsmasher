<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="deriv-site-verification" content="4ce364617b68898181a35029fb4629065ecf4af876caf90e030c948ce24556cc">
    <title>Vector_smasher Pro - Ultimate Tech Workspace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        :root {
            --bg-main: #030712;
            --bg-card: #0b1120;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
        }
        body.light-theme {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-blue: #0284c7;
            --accent-red: #dc2626;
            --accent-green: #16a34a;
            --accent-yellow: #ca8a04;
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            padding: 4px; 
            background-image: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.25) 0%, transparent 45%), 
                              radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.2) 0%, transparent 45%),
                              linear-gradient(135deg, #030712 0%, #080c1b 100%);
            transition: background 0.3s ease;
        }

        /* BACKGROUND SETUP: Town United Night with Blue/Red lighting, computers, laptops, & animated AI robot */
        .tech-bg-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: -1;
            background: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1200&auto=format&fit=crop') no-repeat center center/cover;
            opacity: 0.18; filter: drop-shadow(0 0 15px rgba(56,189,248,0.5));
        }

        /* BOOT SEQUENCE LOADER 1: Vectorsmasher Trading Workspace */
        #bootLoader1 { 
            position: fixed; inset: 0; background: #030712; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; 
        }
        /* BOOT SEQUENCE LOADER 2: Initializing D-Bot */
        #bootLoader2 { 
            position: fixed; inset: 0; background: #030712; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; 
        }
        /* DERIV DETECTED LOGIN LOADER */
        #derivAuthLoader {
            position: fixed; inset: 0; background: #030712; z-index: 9998; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
        }

        .boot-card { background: rgba(13, 19, 34, 0.95); backdrop-filter: blur(16px); border: 1px solid var(--accent-blue); border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px rgba(0,0,0,0.9); }
        .boot-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .boot-subtitle { font-size: 11px; color: var(--accent-blue); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .progress-bar-bg { width: 100%; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-green)); transition: width 0.1s linear; }
        .boot-status { font-size: 11px; color: var(--text-muted); font-weight: 500; display: flex; justify-content: space-between; }

        /* MAIN APP CONTAINER */
        .app-container { width: 100%; max-width: 480px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; min-height: 98vh; display: none; padding: 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); transition: all 0.3s ease; }
        
        /* WELCOME SCREEN */
        #welcomeScreen { display: block; padding: 10px; }
        .welcome-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .brand-box { font-size: 13px; font-weight: bold; color: var(--text-main); }
        .brand-sub { font-size: 9px; color: var(--accent-blue); text-shadow: 0 0 8px rgba(56,189,248,0.6); display: block; font-weight: 800; }
        .welcome-auth-btns { display: flex; gap: 6px; }
